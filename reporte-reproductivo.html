<script>
const WORKER_URL = "https://pysiga.d-alexjose.workers.dev";
const urlParams = new URLSearchParams(window.location.search);
const email = urlParams.get('email');
if (!email) { alert("Parámetro 'email' no encontrado."); location.href = "/"; }

let chartInstancia = null; 
window.chartDataMap = {}; 

function cerrarReporte() {
  if (window.opener) { window.close(); return; }
  const emailParam = encodeURIComponent(email);
  window.location.href = `https://sites.google.com/view/tu-sitio-pysiga?email=${emailParam}`;
}

function recargarConParametros() {
  const mesesSecado = document.getElementById('mesesSecado').value;
  const mesesMaternidad = document.getElementById('mesesMaternidad').value;
  document.getElementById('labelMesesSecado').textContent = mesesSecado;
  document.getElementById('labelMesesMaternidad').textContent = mesesMaternidad;
  cargarReporte(mesesSecado, mesesMaternidad);
}

async function cargarReporte(mesesSecado = 6, mesesMaternidad = 8) {
  try {
    document.getElementById("loader").style.display = "flex";
    document.getElementById("contenido").style.display = "none";
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accion: "reporteReproductivo", email: email, mesesSecado: parseInt(mesesSecado), mesesMaternidad: parseInt(mesesMaternidad) })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Error desconocido");
    document.getElementById("loader").style.display = "none";
    document.getElementById("contenido").style.display = "block";
    
    document.getElementById('mesesSecado').value = data.parametros?.mesesParaSecado || 6;
    document.getElementById('mesesMaternidad').value = data.parametros?.mesesParaMaternidad || 8;
    document.getElementById('labelMesesSecado').textContent = data.parametros?.mesesParaSecado || 6;
    document.getElementById('labelMesesMaternidad').textContent = data.parametros?.mesesParaMaternidad || 8;
    
    renderizarKPIsPrincipales(data.kpis);
    renderizarTablaSecadoMaternidad("tablaSecado", data.detalles.vacasSecado);
    renderizarTablaSecadoMaternidad("tablaMaternidad", data.detalles.vacasMaternidad);
    
    if (data.detalles.hembrasPendientesEvaluar?.length > 0) {
      document.getElementById('seccionHembrasPendientes').style.display = 'block';
      document.getElementById('conteoHembrasPendientes').textContent = data.detalles.hembrasPendientesEvaluar.length;
      renderizarTablaHembrasPendientes("tablaHembrasPendientes", data.detalles.hembrasPendientesEvaluar);
    } else { 
      document.getElementById('seccionHembrasPendientes').style.display = 'none'; 
    }
    
    renderizarTabla("preñadas_menor3m", data.detalles.preñadas_menor3m);
    renderizarTabla("preñadas_3a6m", data.detalles.preñadas_3a6m);
    renderizarTabla("preñadas_mayor6m", data.detalles.preñadas_mayor6m);
    renderizarTabla("vacías_menor3m", data.detalles.vacías_menor3m);
    renderizarTabla("vacías_3a6m", data.detalles.vacías_3a6m);
    renderizarTabla("vacías_mayor6m", data.detalles.vacías_mayor6m);

    // Ejecuta el cálculo preciso de KPIs
    prepararDatosYGrafico(data.kpis, data.detalles);

  } catch (e) { console.error("Error:", e); document.getElementById("loader-text").textContent = `❌ Error: ${e.message}`; }
}

function renderizarKPIsPrincipales(kpis) {
  const mapeo = {
    tasaPreñezGeneral: { id: 'tasaPreñezGeneral', estado: 'estado-tasaGeneral', advertencia: 'advertencia-tasaGeneral', card: 'kpi-tasaGeneral' },
    tasaPreñezVacas: { id: 'tasaPreñezVacas', estado: 'estado-tasaVacas', card: 'kpi-tasaVacas' },
    tasaPreñezNovillas: { id: 'tasaPreñezNovillas', estado: 'estado-tasaNovillas', advertencia: 'advertencia-tasaNovillas', card: 'kpi-tasaNovillas' },
    porcentajeVacías: { id: 'porcentajeVacías', estado: 'estado-vacias', card: 'kpi-vacias' },
    diasAbiertosPromedio: { id: 'diasAbiertosProm', estado: 'estado-diasAbiertos', card: 'kpi-diasAbiertos' },
    intervaloEntrePartos: { id: 'iep', estado: 'estado-iep', card: 'kpi-iep' }
  };
  Object.entries(mapeo).forEach(([key, cfg]) => {
    const kpi = kpis[key]; if (!kpi) return;
    const elValor = document.getElementById(cfg.id), elEstado = document.getElementById(cfg.estado), elCard = document.getElementById(cfg.card), elAdvertencia = cfg.advertencia ? document.getElementById(cfg.advertencia) : null;
    elValor.textContent = kpi.valor + (kpi.unidad || '');
    elCard.className = `kpi-card estado-${kpi.estado}`;
    elEstado.textContent = kpi.estado === 'excelente' ? '✅ Meta' : kpi.estado === 'alerta' ? '⚠️ Revisar' : kpi.estado === 'sin_datos' ? '⚪ Sin datos' : '🔄 Regular';
    if (elAdvertencia && kpi.advertencia) { elAdvertencia.textContent = kpi.advertencia; elAdvertencia.style.display = 'block'; } else if (elAdvertencia) { elAdvertencia.style.display = 'none'; }
  });
}

function prepararDatosYGrafico(kpis, detalles) {
  const preñadas = [...(detalles.preñadas_menor3m || []), ...(detalles.preñadas_3a6m || []), ...(detalles.preñadas_mayor6m || [])];
  const vacias = [...(detalles.vacías_menor3m || []), ...(detalles.vacías_3a6m || []), ...(detalles.vacías_mayor6m || []), ...(detalles.hembrasPendientesEvaluar || [])];
  
  // El tamaño real de la población (Rebaño evaluable)
  const todasLasHembras = [...preñadas, ...vacias];
  const total = todasLasHembras.length;
  
  const conteosPaths = { QUI: 0, CL: 0, FO: 0, EST: 0, PAT: 0 };
  const keysPath = {
    QUI: ["QUI-D", "QUI-I"],
    CL: ["CL-D", "CL-I"],
    FO: ["FO-D", "FO-I"],
    EST: ["EST-D", "EST-I", "OVA-P", "HIPO"],
    PAT: ["PIO", "MOM", "RE-CH"]
  };

  // 🔥 NUEVA LÓGICA ESTRICTA DE BÚSQUEDA
  todasLasHembras.forEach(vaca => {
    // 1. Extraemos el texto y lo ponemos en mayúsculas
    let textoCrudo = (vaca.diagnostico || vaca.motivo || vaca.clasificacion || "").toString().toUpperCase();
    
    // 2. Rompemos el texto en un array de palabras exactas separadas por espacios, comas o puntos
    let palabrasEnTexto = textoCrudo.split(/[\s,;.]+/);
    
    // 3. Verificamos coincidencia exacta para evitar contar si el texto viene "sucio"
    for (let key in keysPath) {
      let tieneLaPatologia = keysPath[key].some(abreviatura => palabrasEnTexto.includes(abreviatura));
      if (tieneLaPatologia) {
        conteosPaths[key]++;
      }
    }
  });

  const calcPct = (c) => total > 0 ? ((c / total) * 100).toFixed(1) : 0;

  const actCard = (idVal, idEst, idCard, count) => {
    document.getElementById(idVal).textContent = `${calcPct(count)}%`;
    const elEst = document.getElementById(idEst);
    const elCard = document.getElementById(idCard);
    
    if(count > 0) {
      elEst.textContent = `⚠️ ${count} casos`;
      elCard.className = `kpi-card estado-alerta`;
    } else {
      elEst.textContent = `✅ 0 casos`;
      elCard.className = `kpi-card estado-excelente`;
    }
  };

  actCard('val-qui', 'estado-qui', 'kpi-qui', conteosPaths.QUI);
  actCard('val-cl', 'estado-cl', 'kpi-cl', conteosPaths.CL);
  actCard('val-fo', 'estado-fo', 'kpi-fo', conteosPaths.FO);
  actCard('val-est', 'estado-est', 'kpi-est', conteosPaths.EST);
  actCard('val-pat', 'estado-pat', 'kpi-pat', conteosPaths.PAT);

  const isVaca = (c) => (c || '').toUpperCase().includes('VACA');
  const isNovilla = (c) => (c || '').toUpperCase().includes('NOVILLA');

  const prenadasVacas = preñadas.filter(v => isVaca(v.clasificacion)).length;
  const vaciasVacas = vacias.filter(v => isVaca(v.clasificacion)).length;
  const prenadasNov = preñadas.filter(v => isNovilla(v.clasificacion)).length;
  const vaciasNov = vacias.filter(v => isNovilla(v.clasificacion)).length;

  window.chartDataMap = {
    'prenez_general': { title: 'Preñez General (Cantidades)', labels: ['Preñadas', 'Vacías / Pendientes'], data: [preñadas.length, vacias.length], bg: ['#27ae60', '#7f8c8d'] },
    'prenez_vacas': { title: 'Preñez en Vacas (Cantidades)', labels: ['Vacas Preñadas', 'Vacas Vacías'], data: [prenadasVacas, vaciasVacas], bg: ['#27ae60', '#7f8c8d'] },
    'prenez_novillas': { title: 'Preñez en Novillas (Cantidades)', labels: ['Novillas Preñadas', 'Novillas Vacías'], data: [prenadasNov, vaciasNov], bg: ['#27ae60', '#7f8c8d'] },
    'QUI': { title: 'Quistes (Cantidad de Casos vs Resto)', labels: ['Con Quistes', 'Resto del Rebaño'], data: [conteosPaths.QUI, total - conteosPaths.QUI], bg: ['#e74c3c', '#bdc3c7'] },
    'CL': { title: 'Cuerpo Lúteo (Cantidad de Casos vs Resto)', labels: ['Con C. Lúteo', 'Resto del Rebaño'], data: [conteosPaths.CL, total - conteosPaths.CL], bg: ['#f39c12', '#bdc3c7'] },
    'FO': { title: 'Folículos (Cantidad de Casos vs Resto)', labels: ['Con Folículos', 'Resto del Rebaño'], data: [conteosPaths.FO, total - conteosPaths.FO], bg: ['#e67e22', '#bdc3c7'] },
    'EST': { title: 'Ov. Estáticos (Cantidad de Casos vs Resto)', labels: ['Con Ov. Estáticos', 'Resto del Rebaño'], data: [conteosPaths.EST, total - conteosPaths.EST], bg: ['#d35400', '#bdc3c7'] },
    'PAT': { title: 'Pat. Uterinas (Cantidad de Casos vs Resto)', labels: ['Con Patologías Uterinas', 'Resto del Rebaño'], data: [conteosPaths.PAT, total - conteosPaths.PAT], bg: ['#c0392b', '#bdc3c7'] }
  };

  renderizarGraficoSeleccionado();
}

function renderizarGraficoSeleccionado() {
  const key = document.getElementById('kpi-chart-select').value;
  const config = window.chartDataMap[key];
  if (!config) return;

  if (chartInstancia) chartInstancia.destroy();
  const ctx = document.getElementById('chartKPI').getContext('2d');
  
  chartInstancia = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: config.labels,
      datasets: [{
        label: 'Número de Animales',
        data: config.data,
        backgroundColor: config.bg,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { 
          beginAtZero: true, 
          title: { display: true, text: 'Cantidad de Animales', font: {weight: 'bold'} },
          ticks: { stepSize: 1 } 
        }
      },
      plugins: {
        legend: { display: false },
        title: { display: true, text: config.title, font: {size: 16} }
      }
    }
  });
}

function renderizarTabla(id, datos, columnas = ['ID','numeroPractico','ultimoParto','diagnostico','fechaDiagnostico','dias']) {
  const tbody = document.getElementById(id); tbody.innerHTML = "";
  if (!datos || datos.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="sin-registros">⚠️ Sin registros en esta categoría</td></tr>'; return; }
  datos.forEach(row => {
    const tr = document.createElement("tr");
    columnas.forEach(col => {
      const td = document.createElement("td");
      let valor = row[col];
      if (col === 'diagnostico') {
        const num = parseFloat(valor);
        if (!isNaN(num) && num > 0) { valor = `✅ ${num} meses`; } 
        else if (valor && valor.toString().trim() !== "") { valor = `⚠️ ${valor}`; } 
        else { valor = `❌ Vacía`; }
      }
      td.textContent = valor || '-'; tr.appendChild(td);
    }); tbody.appendChild(tr);
  });
}

function renderizarTablaSecadoMaternidad(id, datos) {
  const tbody = document.getElementById(id); tbody.innerHTML = "";
  if (!datos || datos.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="sin-registros">⚠️ Sin registros en esta categoría</td></tr>'; return; }
  datos.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${row.ID}</td><td>${row.numeroPractico}</td><td>${row.clasificacion || '-'}</td><td>${row.edadGestacion} meses</td><td>${row.ultimoParto || '-'}</td><td>${row.diagnostico >= 2 ? '✅ ' + row.diagnostico + ' meses' : '❌ Vacía'}</td><td>${row.fechaDiagnostico}</td>`;
    tbody.appendChild(tr);
  });
}

function renderizarTablaHembrasPendientes(id, datos) {
  const tbody = document.getElementById(id); tbody.innerHTML = "";
  if (!datos || datos.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="sin-registros">⚠️ Sin registros</td></tr>'; return; }
  datos.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${row.ID}</td><td>${row.numeroPractico || '-'}</td><td>${row.clasificacion || '-'}</td><td>${row.sexo || '-'}</td><td>${row.ultimoPeso !== 'N/A' ? row.ultimoPeso + ' kg' : 'N/A'}</td><td>${row.motivo || '-'}</td>`;
    tbody.appendChild(tr);
  });
}

function exportarTabla(idTabla, nombreArchivo) {
  const tbody = document.getElementById(idTabla);
  if (!tbody || tbody.querySelector('.sin-registros')) { alert("No hay datos para exportar"); return; }
  let csv = "ID,Número Práctico,Clasificación,Sexo,Último Peso,Motivo\n";
  Array.from(tbody.querySelectorAll("tr")).forEach(tr => {
    const fila = Array.from(tr.querySelectorAll("td")).map(td => `"${td.textContent.replace(/"/g, '""')}"`).join(",");
    csv += fila + "\n";
  });
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${nombreArchivo}_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
}

cargarReporte();
</script>
